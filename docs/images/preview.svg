<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- window -->
  <rect width="1280" height="800" rx="14" fill="#0f141a"/>
  <rect x="0.5" y="0.5" width="1279" height="799" rx="14" fill="none" stroke="#2a323d"/>
  <rect width="1280" height="40" rx="14" fill="#161c24"/>
  <rect y="26" width="1280" height="14" fill="#161c24"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/><circle cx="42" cy="20" r="6" fill="#f59e0b"/><circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="640" y="25" text-anchor="middle" font-size="13" fill="#9ca3af">RAG Assistant — localhost:8501</text>
  <line x1="0" y1="40" x2="1280" y2="40" stroke="#2a323d"/>

  <!-- streamlit header -->
  <rect x="0" y="40" width="1280" height="3" fill="url(#accent)" opacity="0.8"/>
  <rect x="1132" y="56" width="76" height="28" rx="6" fill="none" stroke="#2a323d"/>
  <text x="1170" y="75" text-anchor="middle" font-size="13" fill="#d1d5db">Deploy</text>
  <g fill="#9ca3af"><circle cx="1234" cy="62" r="2"/><circle cx="1234" cy="70" r="2"/><circle cx="1234" cy="78" r="2"/></g>
  <rect x="1060" y="58" width="58" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/>
  <circle cx="1074" cy="70" r="4" fill="#22c55e"/>
  <text x="1096" y="75" text-anchor="middle" font-size="11" fill="#4ade80">local</text>

  <!-- title -->
  <path d="M320 100 h20 l8 8 v26 a3 3 0 0 1 -3 3 h-25 a3 3 0 0 1 -3 -3 v-31 a3 3 0 0 1 3 -3 z" fill="#161c24" stroke="#38bdf8" stroke-width="2"/>
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round"><line x1="324" y1="116" x2="340" y2="116"/><line x1="324" y1="123" x2="340" y2="123"/><line x1="324" y1="130" x2="334" y2="130"/></g>
  <text x="362" y="132" font-size="32" font-weight="700" fill="#f3f4f6">Free RAG Document Assistant</text>
  <text x="320" y="166" font-size="15" fill="#d1d5db">Upload a PDF and ask questions!</text>

  <!-- uploader -->
  <text x="320" y="202" font-size="13" fill="#d1d5db">Choose a PDF file</text>
  <rect x="320" y="212" width="640" height="66" rx="8" fill="#161c24" stroke="#2a323d"/>
  <path d="M348 256 h-6 a9 9 0 0 1 -1 -18 a12 12 0 0 1 23 -3 a8 8 0 0 1 2 16 h-6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <path d="M356 262 v-16 m-5 5 l5 -5 l5 5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="241" font-size="14" fill="#e5e7eb">Drag and drop file here</text>
  <text x="384" y="261" font-size="12" fill="#6b7280">Limit 200MB per file · PDF</text>
  <rect x="842" y="230" width="100" height="30" rx="6" fill="#0f141a" stroke="#2a323d"/>
  <text x="892" y="250" text-anchor="middle" font-size="13" fill="#e5e7eb">Browse files</text>

  <!-- uploaded file row -->
  <rect x="330" y="290" width="16" height="20" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="358" y="305" font-size="14" fill="#e5e7eb">company_handbook.pdf</text>
  <text x="514" y="305" font-size="12" fill="#6b7280">2.4MB</text>
  <g stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"><line x1="938" y1="294" x2="948" y2="304"/><line x1="948" y1="294" x2="938" y2="304"/></g>

  <!-- success -->
  <rect x="320" y="324" width="640" height="44" rx="8" fill="#0f2a1c" stroke="#166534"/>
  <text x="340" y="351" font-size="14" fill="#4ade80">PDF processed successfully! You can now ask questions.</text>

  <!-- user message -->
  <rect x="320" y="386" width="32" height="32" rx="8" fill="#f97316"/>
  <circle cx="336" cy="398" r="5" fill="#0f141a"/>
  <path d="M327 412 a9 7 0 0 1 18 0" fill="#0f141a"/>
  <text x="368" y="408" font-size="15" fill="#e5e7eb">How many days of paid leave do new employees get?</text>

  <!-- assistant message -->
  <rect x="320" y="432" width="640" height="72" rx="8" fill="#161c24"/>
  <rect x="332" y="444" width="32" height="32" rx="8" fill="#eab308"/>
  <rect x="340" y="454" width="16" height="12" rx="3" fill="#0f141a"/>
  <circle cx="345" cy="460" r="1.8" fill="#eab308"/><circle cx="351" cy="460" r="1.8" fill="#eab308"/>
  <text x="380" y="460" font-size="15" fill="#e5e7eb">New full-time employees receive 20 days of paid annual leave per year,</text>
  <text x="380" y="484" font-size="15" fill="#e5e7eb">accrued monthly. Up to 5 unused days can be carried over to next year.</text>

  <!-- expander -->
  <rect x="320" y="518" width="640" height="196" rx="8" fill="#0f141a" stroke="#2a323d"/>
  <path d="M338 532 l6 6 l6 -6" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="362" y="541" font-size="14" fill="#e5e7eb">See Source Documents</text>
  <line x1="320" y1="556" x2="960" y2="556" stroke="#2a323d"/>
  <g font-size="13">
    <text x="340" y="582" font-weight="700" fill="#f3f4f6">Source 1 (Page 12):</text>
    <text x="340" y="602" fill="#9ca3af">4.2 Annual Leave. All full-time employees are entitled to 20 working days of paid...</text>
    <text x="340" y="634" font-weight="700" fill="#f3f4f6">Source 2 (Page 13):</text>
    <text x="340" y="654" fill="#9ca3af">Carry-over. A maximum of five (5) unused leave days may be carried forward into...</text>
    <text x="340" y="686" font-weight="700" fill="#f3f4f6">Source 3 (Page 4):</text>
    <text x="340" y="706" fill="#9ca3af">Probation. New hires begin accruing leave from their first day of employment...</text>
  </g>

  <!-- chat input -->
  <rect x="320" y="736" width="640" height="44" rx="10" fill="#161c24" stroke="#2a323d"/>
  <text x="340" y="763" font-size="14" fill="#6b7280">Ask a question about the PDF...</text>
  <path d="M928 750 l16 8 l-16 8 l3 -8 z" fill="#6b7280"/>

  <!-- side annotations -->
  <g font-size="12">
    <rect x="996" y="440" width="244" height="56" rx="10" fill="#161c24" stroke="#2a323d"/>
    <rect x="996" y="440" width="4" height="56" rx="2" fill="#22c55e"/>
    <text x="1014" y="463" font-weight="700" fill="#f3f4f6">llama3.2 via Ollama</text>
    <text x="1014" y="483" fill="#9ca3af">answers only from retrieved context</text>
    <rect x="996" y="590" width="244" height="56" rx="10" fill="#161c24" stroke="#2a323d"/>
    <rect x="996" y="590" width="4" height="56" rx="2" fill="#38bdf8"/>
    <text x="1014" y="613" font-weight="700" fill="#f3f4f6">Top-3 chunks from ChromaDB</text>
    <text x="1014" y="633" fill="#9ca3af">page number + first 500 characters</text>
  </g>
</svg>
