<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#2a323d"/>

  <!-- PDF document -->
  <path d="M80 96 h70 l26 26 v102 a8 8 0 0 1 -8 8 h-88 a8 8 0 0 1 -8 -8 v-120 a8 8 0 0 1 8 -8 z" fill="#161c24" stroke="#2a323d" stroke-width="2"/>
  <path d="M150 96 v18 a8 8 0 0 0 8 8 h18" fill="none" stroke="#2a323d" stroke-width="2"/>
  <g fill="url(#accent)">
    <rect x="88" y="138" width="72" height="6" rx="3"/>
    <rect x="88" y="154" width="56" height="6" rx="3" opacity="0.8"/>
    <rect x="88" y="170" width="66" height="6" rx="3" opacity="0.65"/>
    <rect x="88" y="186" width="44" height="6" rx="3" opacity="0.5"/>
  </g>
  <rect x="88" y="206" width="38" height="18" rx="4" fill="#3b1416" stroke="#7f1d1d"/>
  <text x="107" y="219" text-anchor="middle" font-size="11" font-weight="700" fill="#fca5a5">PDF</text>

  <!-- arrow -->
  <path d="M196 164 h36" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 154 l12 10 l-12 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chat bubble -->
  <path d="M262 118 h96 a12 12 0 0 1 12 12 v56 a12 12 0 0 1 -12 12 h-58 l-20 18 v-18 h-18 a12 12 0 0 1 -12 -12 v-56 a12 12 0 0 1 12 -12 z" fill="#161c24" stroke="#2a323d" stroke-width="2"/>
  <circle cx="288" cy="158" r="6" fill="#22c55e"/>
  <circle cx="310" cy="158" r="6" fill="#2dd4bf"/>
  <circle cx="332" cy="158" r="6" fill="#38bdf8"/>

  <text x="420" y="150" font-size="60" font-weight="700" fill="#f3f4f6">Local <tspan fill="url(#accent)">RAG</tspan> Assistant</text>
  <text x="422" y="196" font-size="24" fill="#9ca3af">Chat with any PDF, fully offline: no API keys, no data leaves your machine</text>

  <g font-size="15" font-weight="600">
    <rect x="422" y="226" width="136" height="32" rx="16" fill="#0f2a1c" stroke="#166534"/>
    <text x="490" y="247" text-anchor="middle" fill="#4ade80">LangChain LCEL</text>
    <rect x="570" y="226" width="164" height="32" rx="16" fill="#0c2233" stroke="#075985"/>
    <text x="652" y="247" text-anchor="middle" fill="#7dd3fc">Ollama · llama3.2</text>
    <rect x="746" y="226" width="160" height="32" rx="16" fill="#2a1f0b" stroke="#92400e"/>
    <text x="826" y="247" text-anchor="middle" fill="#fbbf24">nomic-embed-text</text>
    <rect x="918" y="226" width="110" height="32" rx="16" fill="#241433" stroke="#6b21a8"/>
    <text x="973" y="247" text-anchor="middle" fill="#d8b4fe">ChromaDB</text>
    <rect x="1040" y="226" width="110" height="32" rx="16" fill="#1e2630" stroke="#2a323d"/>
    <text x="1095" y="247" text-anchor="middle" fill="#d1d5db">Streamlit</text>
  </g>
</svg>
